<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SU — Call</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/call.css?v={{ static_v }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-left">
                    <h2><a href="/" class="header-home-link">SU</a></h2>
                </div>
                <div class="header-actions">
                    <span class="session-id">Call</span>
                    <button id="end-session-btn" class="danger-btn">End</button>
                </div>
            </div>

            <div id="messages" class="messages-container">
            </div>

            <div id="voice-status" class="voice-status" style="display: none;">
                <span id="voice-status-dot" class="voice-status-dot"></span>
                <span id="voice-status-text" class="voice-status-text"></span>
            </div>

            <div class="input-container">
                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    rows="3"
                ></textarea>
                <button id="voice-btn" class="voice-btn" title="Tap to speak" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button id="send-btn" class="primary-btn">Send</button>
            </div>

            <div id="status" class="status-indicator"></div>
        </div>
    </div>

    <!-- Call overlay (starts in active state for deep-link calls) -->
    <div id="call-overlay" class="call-overlay">
        <div class="call-ring-screen">
            <div class="call-avatar-wrap">
                <div class="call-ring"></div>
                <div class="call-ring"></div>
                <div class="call-ring"></div>
                <div class="call-avatar">SU</div>
            </div>
            <div class="call-name">SU</div>
            <div class="call-state-label">SU is calling...</div>
            <div class="call-ring-actions">
                <button id="call-reject-btn" class="call-btn call-btn-hangup" title="Decline">
                    <svg viewBox="0 0 24 24"><path d="M23 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 1.08 2.18 2 2 0 0 1 3 0h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L6.09 8.8a16 16 0 0 0 9.12 9.12l2.16-2.16a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 23 16.92z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button id="call-accept-btn" class="call-btn call-btn-accept" title="Answer">
                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 1.08 2.18 2 2 0 0 1 3 0h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L6.09 8.8a16 16 0 0 0 9.12 9.12l2.16-2.16a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
        </div>

        <div class="call-active-screen">
            <div class="call-avatar-wrap">
                <div class="call-avatar">SU</div>
            </div>
            <div class="call-name">SU</div>
            <div class="call-state-label">
                <span class="call-state-dot"></span>
                <span>Connected</span>
            </div>
            <div class="call-timer">0:00</div>
            <div class="call-actions">
                <button id="call-mute-btn" class="call-btn call-btn-mute" title="Mute">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button id="call-hangup-btn" class="call-btn call-btn-hangup" title="Hang up">
                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 1.08 2.18 2 2 0 0 1 3 0h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L6.09 8.8a16 16 0 0 0 9.12 9.12l2.16-2.16a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const SESSION_ID = "{{ session_id }}";
        const AUTO_CALL_MODE = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script src="/static/js/voice.js?v={{ static_v }}"></script>
    <script src="/static/js/call-manager.js?v={{ static_v }}"></script>
    <script src="/static/js/chat.js?v={{ static_v }}"></script>
</body>
</html>
