<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SU — Sessions</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1a1a1a;
            --border: #2a2a2a;
            --text: #c8c8c8;
            --text-muted: #5a5a5a;
            --green: #33ff33;
            --green-dim: #1a9e1a;
            --green-glow: rgba(51, 255, 51, 0.15);
            --yellow: #cccc33;
            --red: #ff3333;
            --blue: #3399ff;
            --mono: 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
        }
        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            height: 48px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
        }
        .topbar h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--green);
            text-shadow: 0 0 10px var(--green-glow);
        }
        .topbar a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-family: var(--mono);
        }
        .topbar a:hover { color: var(--green); }

        /* Layout: sidebar + main */
        .layout {
            display: flex;
            height: calc(100vh - 48px);
        }

        /* Session sidebar */
        .sidebar {
            width: 280px;
            min-width: 280px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
        }
        .session-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }
        .session-item:hover { background: var(--surface2); }
        .session-item.active {
            background: rgba(51, 255, 51, 0.05);
            border-left: 2px solid var(--green-dim);
        }
        .session-item .sid {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
        }
        .session-item .meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }
        .session-item .badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 0;
            font-weight: 600;
            font-family: var(--mono);
        }
        .badge-active { background: rgba(51, 255, 51, 0.1); color: var(--green); border: 1px solid #113311; }
        .badge-ended { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

        .session-link {
            color: var(--green);
            text-decoration: none;
            font-size: 10px;
            font-family: var(--mono);
            opacity: 0.7;
            transition: opacity 0.1s;
        }
        .session-link:hover { opacity: 1; text-decoration: underline; }

        .sidebar-actions {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        .btn-end-all {
            width: 100%;
            background: rgba(255, 51, 51, 0.08);
            color: var(--red);
            border: 1px solid rgba(255, 51, 51, 0.2);
            padding: 6px 10px;
            font-size: 11px;
            font-family: var(--mono);
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background 0.1s;
        }
        .btn-end-all:hover { background: rgba(255, 51, 51, 0.15); }
        .btn-end-all:disabled { opacity: 0.4; cursor: default; }

        /* Main panels */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Panel controls */
        .panel-controls {
            height: 40px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            font-size: 12px;
        }
        .panel-controls label {
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 11px;
        }
        .panel-controls select, .panel-controls input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 0;
            font-size: 12px;
            font-family: var(--mono);
        }
        .panel-controls select:focus, .panel-controls input:focus {
            outline: none;
            border-color: var(--green-dim);
        }
        .sync-badge {
            margin-left: auto;
            background: rgba(51, 255, 51, 0.08);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 0;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid #113311;
            cursor: pointer;
            font-family: var(--mono);
        }

        /* Dual-panel container */
        .panels {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .panel + .panel { border-left: 1px solid var(--border); }

        .panel-header {
            height: 36px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        /* Messages panel */
        .msg-row {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.5;
            position: relative;
        }
        .msg-row:hover { background: rgba(51, 255, 51, 0.03); }
        .msg-row.highlighted { background: rgba(51, 255, 51, 0.08); }
        .msg-time {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-right: 8px;
            white-space: nowrap;
        }
        .msg-role {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 8px;
            padding: 1px 6px;
            border-radius: 0;
            font-family: var(--mono);
        }
        .msg-role-user { background: rgba(51, 153, 255, 0.1); color: var(--blue); border: 1px solid #112233; }
        .msg-role-assistant { background: rgba(51, 255, 51, 0.08); color: var(--green); border: 1px solid #113311; }
        .msg-role-memory { background: rgba(204, 204, 51, 0.08); color: var(--yellow); border: 1px solid #333300; }
        .msg-role-memory_consumed { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
        .msg-content {
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            margin-top: 4px;
        }

        /* Logs panel */
        .log-row {
            padding: 4px 12px;
            border-bottom: 1px solid rgba(42, 42, 42, 0.5);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.6;
            display: flex;
            gap: 8px;
            align-items: baseline;
            cursor: default;
        }
        .log-row:hover { background: rgba(51, 255, 51, 0.03); }
        .log-row.highlighted { background: rgba(51, 255, 51, 0.08); }
        .log-time {
            color: var(--text-muted);
            font-size: 11px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .log-level {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0 5px;
            border-radius: 0;
            flex-shrink: 0;
            min-width: 50px;
            text-align: center;
            font-family: var(--mono);
        }
        .log-level-debug { background: var(--surface2); color: var(--text-muted); }
        .log-level-info { background: rgba(51, 153, 255, 0.1); color: var(--blue); }
        .log-level-warning { background: rgba(204, 204, 51, 0.1); color: var(--yellow); }
        .log-level-error { background: rgba(255, 51, 51, 0.1); color: var(--red); }
        .log-event {
            color: var(--text);
            flex-shrink: 0;
            font-weight: 500;
        }
        .log-data {
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>SU // Sessions</h1>
        <a href="/">Chat</a>
        <a href="/planner">Planner</a>
        <a href="/daemons">Daemons</a>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">Sessions</div>
            <div class="sidebar-actions" id="sidebar-actions" style="display: none;">
                <button class="btn-end-all" id="end-all-btn">End All Active</button>
            </div>
            <div class="session-list" id="session-list">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <div class="main">
            <div class="panel-controls">
                <label>Level:</label>
                <select id="level-filter">
                    <option value="">All</option>
                    <option value="debug">Debug</option>
                    <option value="info" selected>Info+</option>
                    <option value="warning">Warning+</option>
                    <option value="error">Error</option>
                </select>
                <label>Search:</label>
                <input type="text" id="log-search" placeholder="Filter events..." style="width: 160px;">
                <span class="sync-badge" id="sync-badge">Time Sync ON</span>
            </div>

            <div class="panels">
                <div class="panel">
                    <div class="panel-header">Session Messages</div>
                    <div class="panel-body" id="messages-panel">
                        <div class="empty-state">Select a session</div>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header">System Logs</div>
                    <div class="panel-body" id="logs-panel">
                        <div class="empty-state">Select a session</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const sessionList = document.getElementById('session-list');
        const messagesPanel = document.getElementById('messages-panel');
        const logsPanel = document.getElementById('logs-panel');
        const levelFilter = document.getElementById('level-filter');
        const logSearch = document.getElementById('log-search');
        const syncBadge = document.getElementById('sync-badge');
        const endAllBtn = document.getElementById('end-all-btn');
        const sidebarActions = document.getElementById('sidebar-actions');

        let currentSessionId = null;
        let allMessages = [];
        let allLogs = [];
        let syncEnabled = true;

        syncBadge.addEventListener('click', () => {
            syncEnabled = !syncEnabled;
            syncBadge.textContent = syncEnabled ? 'Time Sync ON' : 'Time Sync OFF';
            syncBadge.style.opacity = syncEnabled ? 1 : 0.5;
        });

        endAllBtn.addEventListener('click', async () => {
            if (!confirm('End all active sessions?')) return;
            endAllBtn.disabled = true;
            endAllBtn.textContent = 'Ending...';
            try {
                const res = await fetch('/api/sessions/end-all', { method: 'POST' });
                const data = await res.json();
                endAllBtn.textContent = `Ended ${data.count} session(s)`;
                await loadSessions();
            } catch (e) {
                endAllBtn.textContent = 'Error';
            }
            setTimeout(() => {
                endAllBtn.textContent = 'End All Active';
                endAllBtn.disabled = false;
            }, 2000);
        });

        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            if (!sessions.length) {
                sessionList.innerHTML = '<div class="empty-state">No sessions yet</div>';
                sidebarActions.style.display = 'none';
                return;
            }

            const hasActive = sessions.some(s => s.status === 'active');
            sidebarActions.style.display = hasActive ? '' : 'none';

            sessionList.innerHTML = sessions.map(s => {
                const dt = s.last_activity ? new Date(s.last_activity) : null;
                const timeStr = dt ? dt.toLocaleString() : '—';
                const badgeClass = s.status === 'active' ? 'badge-active' : 'badge-ended';
                const chatLink = s.status === 'active'
                    ? `<a href="/chat/${s.id}" class="session-link" onclick="event.stopPropagation()">open chat &rarr;</a>`
                    : '';
                return `<div class="session-item" data-id="${s.id}">
                    <div class="sid">${s.id.slice(0, 8)} ${chatLink}</div>
                    <div class="meta">
                        <span>${timeStr}</span>
                        <span class="badge ${badgeClass}">${s.status}</span>
                    </div>
                    <div class="meta"><span>${s.message_count} messages</span></div>
                </div>`;
            }).join('');

            sessionList.querySelectorAll('.session-item').forEach(el => {
                el.addEventListener('click', () => selectSession(el.dataset.id));
            });
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;

            // Highlight in sidebar
            sessionList.querySelectorAll('.session-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === sessionId);
            });

            // Load messages + logs in parallel
            const [msgRes, logRes] = await Promise.all([
                fetch(`/api/sessions/${sessionId}/messages`),
                fetch(`/api/logs?session_id=${sessionId}&limit=2000`),
            ]);
            allMessages = await msgRes.json();
            allLogs = await logRes.json();

            renderMessages();
            renderLogs();
        }

        function fmtTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
                + '.' + String(d.getMilliseconds()).padStart(3, '0');
        }

        function renderMessages() {
            if (!allMessages.length) {
                messagesPanel.innerHTML = '<div class="empty-state">No messages</div>';
                return;
            }
            messagesPanel.innerHTML = allMessages.map((m, i) => {
                const roleClass = `msg-role-${m.role}`;
                const content = m.content.length > 2000 ? m.content.slice(0, 2000) + '...' : m.content;
                return `<div class="msg-row" data-ts="${m.created_at || ''}" data-idx="${i}">
                    <span class="msg-time">${fmtTime(m.created_at)}</span>
                    <span class="msg-role ${roleClass}">${m.role}</span>
                    <div class="msg-content">${escapeHtml(content)}</div>
                </div>`;
            }).join('');

            // Click to sync
            messagesPanel.querySelectorAll('.msg-row').forEach(el => {
                el.addEventListener('click', () => {
                    if (!syncEnabled) return;
                    const ts = el.dataset.ts;
                    if (ts) syncLogsToTime(ts, el);
                });
            });
        }

        function renderLogs() {
            const levelVal = levelFilter.value;
            const searchVal = logSearch.value.toLowerCase();

            const levelOrder = { debug: 0, info: 1, warning: 2, error: 3 };
            const minLevel = levelOrder[levelVal] ?? 0;

            const filtered = allLogs.filter(l => {
                const ll = levelOrder[l.level] ?? 0;
                if (ll < minLevel) return false;
                if (searchVal && !l.event.toLowerCase().includes(searchVal)
                    && !(l.data || '').toLowerCase().includes(searchVal)) return false;
                return true;
            });

            if (!filtered.length) {
                logsPanel.innerHTML = '<div class="empty-state">No logs match filter</div>';
                return;
            }

            logsPanel.innerHTML = filtered.map((l, i) => {
                const data = l.data && l.data !== '{}' ? l.data : '';
                let dataStr = '';
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        dataStr = Object.entries(parsed)
                            .map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`)
                            .join(' ');
                    } catch { dataStr = data; }
                }
                return `<div class="log-row" data-ts="${l.timestamp}" data-idx="${i}">
                    <span class="log-time">${fmtTime(l.timestamp)}</span>
                    <span class="log-level log-level-${l.level}">${l.level}</span>
                    <span class="log-event">${escapeHtml(l.event)}</span>
                    <span class="log-data">${escapeHtml(dataStr)}</span>
                </div>`;
            }).join('');

            // Click to sync messages
            logsPanel.querySelectorAll('.log-row').forEach(el => {
                el.addEventListener('click', () => {
                    if (!syncEnabled) return;
                    const ts = el.dataset.ts;
                    if (ts) syncMessagesToTime(ts, el);
                });
            });
        }

        function syncLogsToTime(targetTs, sourceEl) {
            // Find the closest log row by time
            const logRows = logsPanel.querySelectorAll('.log-row');
            if (!logRows.length) return;

            // Clear highlights
            messagesPanel.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));
            logsPanel.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));
            sourceEl.classList.add('highlighted');

            const targetTime = new Date(targetTs).getTime();
            let closest = logRows[0];
            let closestDiff = Infinity;

            logRows.forEach(row => {
                const ts = row.dataset.ts;
                if (!ts) return;
                const diff = Math.abs(new Date(ts).getTime() - targetTime);
                if (diff < closestDiff) {
                    closestDiff = diff;
                    closest = row;
                }
            });

            closest.classList.add('highlighted');
            closest.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function syncMessagesToTime(targetTs, sourceEl) {
            const msgRows = messagesPanel.querySelectorAll('.msg-row');
            if (!msgRows.length) return;

            messagesPanel.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));
            logsPanel.querySelectorAll('.highlighted').forEach(e => e.classList.remove('highlighted'));
            sourceEl.classList.add('highlighted');

            const targetTime = new Date(targetTs).getTime();
            let closest = msgRows[0];
            let closestDiff = Infinity;

            msgRows.forEach(row => {
                const ts = row.dataset.ts;
                if (!ts) return;
                const diff = Math.abs(new Date(ts).getTime() - targetTime);
                if (diff < closestDiff) {
                    closestDiff = diff;
                    closest = row;
                }
            });

            closest.classList.add('highlighted');
            closest.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Filter controls
        levelFilter.addEventListener('change', renderLogs);
        logSearch.addEventListener('input', renderLogs);

        // Boot
        loadSessions();

        // Check for session_id in URL hash
        if (window.location.hash) {
            const hashId = window.location.hash.slice(1);
            if (hashId) setTimeout(() => selectSession(hashId), 500);
        }
    })();
    </script>
    <script src="/static/js/notifications.js"></script>
</body>
</html>
