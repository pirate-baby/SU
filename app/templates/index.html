<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SU</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
    <div class="container">
        <div class="landing-page">
            <h1>SU</h1>
            <p>personal assistant // confidant // companion</p>
            <button id="new-chat-btn" class="primary-btn">New Session</button>
            <p style="margin-top: 24px;"><a href="/planner">Planner</a></p>
            <p style="margin-top: 8px;"><a href="/sessions">Session Logs</a></p>
            <p style="margin-top: 8px;"><a href="/daemons">Daemons</a></p>
            <p style="margin-top: 8px;"><a id="vibe-kanban-link" href="#" target="_blank">Vibe Kanban</a></p>
            <p style="margin-top: 24px;">
                <button id="update-btn" class="primary-btn" style="font-size:0.8rem;padding:6px 16px;text-transform:none;letter-spacing:0;">Update &amp; Restart</button>
                <span id="update-status" style="margin-left:10px;font-size:0.8rem;color:#888;"></span>
            </p>
        </div>
    </div>

    <script>
        // Vibe Kanban is served by nginx on port 53187 (same TLS as main app)
        document.getElementById('vibe-kanban-link').href =
            location.protocol + '//' + location.hostname + ':53187';

        document.getElementById('new-chat-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/sessions/new', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = `/chat/${data.session_id}`;
                } else {
                    alert('Failed to create session');
                }
            } catch (error) {
                console.error('Error creating session:', error);
                alert('Error creating session');
            }
        });
    </script>
    <script>
        document.getElementById('update-btn').addEventListener('click', async () => {
            const btn = document.getElementById('update-btn');
            const status = document.getElementById('update-status');
            btn.disabled = true;
            status.textContent = 'Pulling & pushing…';
            status.style.color = '#888';
            try {
                const resp = await fetch('/api/admin/update', { method: 'POST' });
                if (resp.ok) {
                    status.textContent = 'Restarting — page will reload shortly…';
                    status.style.color = '#4caf50';
                    // Give the container ~15 s to rebuild, then reload.
                    setTimeout(() => location.reload(), 15000);
                } else {
                    const text = await resp.text();
                    status.textContent = `Failed: ${text}`;
                    status.style.color = '#f44336';
                    btn.disabled = false;
                }
            } catch (err) {
                status.textContent = `Error: ${err}`;
                status.style.color = '#f44336';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
