<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ session_id }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Claude Chat</h2>
                <div class="header-actions">
                    <span class="session-id">Session: {{ session_id[:8] }}</span>
                    <button id="end-session-btn" class="danger-btn">End Session</button>
                </div>
            </div>

            <div id="messages" class="messages-container">
                <!-- Messages will be appended here -->
            </div>

            <div id="voice-status" class="voice-status" style="display: none;">
                <span id="voice-status-dot" class="voice-status-dot"></span>
                <span id="voice-status-text" class="voice-status-text"></span>
            </div>

            <div class="input-container">
                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    rows="3"
                ></textarea>
                <button id="voice-btn" class="voice-btn" title="Tap to speak" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button id="send-btn" class="primary-btn">Send</button>
            </div>

            <div id="status" class="status-indicator"></div>
        </div>
    </div>

    <script>
        const SESSION_ID = "{{ session_id }}";
    </script>
    <script src="/static/js/voice.js"></script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
