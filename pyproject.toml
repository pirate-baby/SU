[project]
name = "su-personal-assistant"
version = "4.0.0"
description = "Personal assistant powered by pydantic-ai"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=0.1.0",
    "anthropic>=0.40.0",
    "python-multipart==0.0.6",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "python-telegram-bot>=21.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]
