services:
  claude-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-task-executor
    expose:
      - "8000"
    volumes:
      - ${HOME}/.claude:/home/appuser/.claude:ro
      - ${CLAUDE_WORKDIR:-./claude-workspace}:/workspace
      - basic-memory-data:/home/appuser/basic-memory
      - session-data:/data
      - ./.env:/app/.env:ro
      - .:/src
    environment:
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
      - BASIC_MEMORY_CONFIG_DIR=/home/appuser/basic-memory
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - DATABASE_PATH=/data/sessions.db
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_TTS_MODEL=${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      - USER_NAME=${USER_NAME:-}
      - SELF_ITERATION_MODE=${SELF_ITERATION_MODE:-false}
      - MAX_CLAUDE_PROCESSES=${MAX_CLAUDE_PROCESSES:-3}
      - PLAYWRIGHT_MCP_URL=${PLAYWRIGHT_MCP_URL:-http://host.docker.internal:8931/sse}
      - PROTONMAIL_USERNAME=${PROTONMAIL_USERNAME:-}
      - PROTONMAIL_PASSWORD=${PROTONMAIL_PASSWORD:-}
      - PROTONMAIL_SMTP_HOST=${PROTONMAIL_SMTP_HOST:-host.docker.internal}
      - PROTONMAIL_SMTP_PORT=${PROTONMAIL_SMTP_PORT:-1025}
      - PROTONMAIL_IMAP_HOST=${PROTONMAIL_IMAP_HOST:-host.docker.internal}
      - PROTONMAIL_IMAP_PORT=${PROTONMAIL_IMAP_PORT:-1143}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - APP_HOST=${APP_HOST:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    networks:
      - claude-network

  nginx:
    image: nginx:alpine
    container_name: claude-nginx
    ports:
      - "80:80"
      - "443:443"
      - "53187:53187"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - claude-executor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - claude-network

volumes:
  basic-memory-data:
  session-data:

networks:
  claude-network:
    driver: bridge
